apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-collector
  namespace: dev
spec:
  selector:
    matchLabels:
      app: log-collector
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: log-collector
    spec:
      tolerations:
        - effect: NoSchedule
          operator: Exists
      containers:
        - name: collector
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              while true; do
                echo "$(date) [$(hostname)] collecting logs from node"
                sleep 10
              done
          volumeMounts:
            - name: varlog
              mountPath: /host/var/log
              readOnly: true
          resources:
            requests:
              cpu: "5m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
# Vérifier : un pod par nœud (control-plane inclus grâce à la toleration)
#   kubectl get pods -n dev -l app=log-collector -o wide
#   kubectl logs -n dev -l app=log-collector --prefix
