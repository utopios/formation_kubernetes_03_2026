apiVersion: apps/v1
kind: Deployment
metadata:
  name: monapp
  namespace: dev
  annotations:
    kubernetes.io/change-cause: "version cassee — image inexistante (pour demo rollback)"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 60
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: monapp
  template:
    metadata:
      labels:
        app: monapp
        version: v3-broken
    spec:
      containers:
        - name: app
          image: nginx:cette-image-nexiste-pas
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
            failureThreshold: 2
# Commandes de rollback :
#   kubectl rollout status deployment/monapp -n dev       # voir le blocage
#   kubectl rollout history deployment/monapp -n dev      # voir l'historique
#   kubectl rollout undo deployment/monapp -n dev         # revenir à v2
#   kubectl rollout undo deployment/monapp -n dev --to-revision=1  # revenir à v1
