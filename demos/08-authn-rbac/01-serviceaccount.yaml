apiVersion: v1
kind: ServiceAccount
metadata:
  name: mon-app
  namespace: dev
automountServiceAccountToken: false
---
# Pod utilisant le SA dédié avec token monté explicitement
apiVersion: v1
kind: Pod
metadata:
  name: demo-serviceaccount
  namespace: dev
spec:
  serviceAccountName: mon-app
  automountServiceAccountToken: true
  containers:
    - name: app
      image: alpine/k8s:1.27.16
      command:
        - sh
        - -c
        - |
          echo "=== Fichiers du ServiceAccount montés ==="
          ls -la /var/run/secrets/kubernetes.io/serviceaccount/
          echo ""
          echo "=== Namespace ==="
          cat /var/run/secrets/kubernetes.io/serviceaccount/namespace
          echo ""
          echo "=== Token (premiers 100 chars) ==="
          head -c 100 /var/run/secrets/kubernetes.io/serviceaccount/token
          echo ""
          echo ""
          echo "=== Appel API avec le token ==="
          TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          curl -s --cacert $CA \
            -H "Authorization: Bearer $TOKEN" \
            https://kubernetes.default.svc/api/v1/namespaces/dev/pods \
            | head -5 || echo "(Forbidden — aucun RBAC encore)"
          sleep 3600
      resources:
        requests: {cpu: "10m", memory: "16Mi"}
        limits: {cpu: "100m", memory: "64Mi"}
# Commandes :
#   kubectl logs demo-serviceaccount -n dev
#   kubectl create token mon-app -n dev --duration=1h
