apiVersion: v1
kind: Pod
metadata:
  name: demo-config-volume
  namespace: dev
spec:
  containers:
    - name: nginx
      image: nginx:1.25-alpine
      ports:
        - containerPort: 80
      volumeMounts:
        # Méthode 3 : ConfigMap montée comme fichier (auto-refresh ~60s)
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
        # Secret monté comme fichier (permissions 0400 automatiques)
        - name: db-secret
          mountPath: /etc/secrets
          readOnly: true
      resources:
        requests: {cpu: "10m", memory: "16Mi"}
        limits: {cpu: "100m", memory: "64Mi"}
      readinessProbe:
        httpGet:
          path: /health
          port: 80
        periodSeconds: 5
  volumes:
    - name: nginx-config
      configMap:
        name: app-config
        items:
          - key: nginx.conf
            path: default.conf
    - name: db-secret
      secret:
        secretName: db-creds
        defaultMode: 0400
# Vérifier :
#   kubectl exec demo-config-volume -n dev -- cat /etc/nginx/conf.d/default.conf
#   kubectl exec demo-config-volume -n dev -- ls -la /etc/secrets/
#   kubectl exec demo-config-volume -n dev -- cat /etc/secrets/username
#   kubectl exec demo-config-volume -n dev -- cat /etc/secrets/connection-string
#
# Test auto-refresh ConfigMap :
#   kubectl edit configmap app-config -n dev   # modifier nginx.conf
#   Attendre ~60s puis :
#   kubectl exec demo-config-volume -n dev -- cat /etc/nginx/conf.d/default.conf
