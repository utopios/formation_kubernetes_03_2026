apiVersion: v1
kind: Pod
metadata:
  name: demo-config-env
  namespace: dev
spec:
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "=== Variables injectées depuis ConfigMap (envFrom) ==="
          echo "DB_HOST=$DB_HOST"
          echo "DB_PORT=$DB_PORT"
          echo "LOG_LEVEL=$LOG_LEVEL"
          echo ""
          echo "=== Variables injectées depuis Secret ==="
          echo "DB_USER=$DB_USER"
          echo "DB_PASS=$DB_PASS"
          echo ""
          echo "=== Downward API ==="
          echo "POD_NAME=$POD_NAME"
          echo "POD_IP=$POD_IP"
          echo "NODE_NAME=$NODE_NAME"
          echo "CPU_REQUEST=$CPU_REQUEST"
          sleep 3600
      envFrom:
        # Méthode 1 : toutes les clés de la ConfigMap en variables d'env
        - configMapRef:
            name: app-config
      env:
        # Méthode 2 : clé sélective depuis ConfigMap
        - name: DATABASE_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_HOST
        # Clés sélectives depuis Secret
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-creds
              key: username
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: db-creds
              key: password
        # Downward API
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: CPU_REQUEST
          valueFrom:
            resourceFieldRef:
              resource: requests.cpu
              divisor: "1m"
      resources:
        requests: {cpu: "50m", memory: "16Mi"}
        limits: {cpu: "100m", memory: "32Mi"}
# Vérifier :
#   kubectl logs demo-config-env -n dev
#   kubectl exec demo-config-env -n dev -- env | sort
