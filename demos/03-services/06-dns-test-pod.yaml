apiVersion: v1
kind: Pod
metadata:
  name: dns-debug
  namespace: dev
spec:
  containers:
    - name: debug
      image: busybox:1.36
      command: ["sleep", "3600"]
  restartPolicy: Never
---
# Commandes à lancer après : kubectl exec -it dns-debug -n dev -- sh
#
# Test DNS même namespace (forme courte) :
#   nslookup api-clusterip
#
# Test DNS cross-namespace :
#   nslookup api-clusterip.dev.svc.cluster.local
#
# Headless → retourne toutes les IPs des pods :
#   nslookup api-headless
#
# ExternalName → CNAME vers httpbin.org :
#   nslookup external-httpbin
#
# Contenu resolv.conf du pod :
#   cat /etc/resolv.conf
#
# Test HTTP load balancing (répéter 5 fois) :
#   for i in 1 2 3 4 5; do wget -qO- http://api-clusterip; echo; done
