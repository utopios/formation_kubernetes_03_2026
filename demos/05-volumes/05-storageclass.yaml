# Voir les StorageClasses disponibles dans Kind :
#   kubectl get storageclass
#   kubectl describe storageclass standard
#
# Kind fournit une StorageClass "standard" avec le provisioner rancher.io/local-path
# qui crée des PV locaux automatiquement (provisioning dynamique)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: demo-fast
provisioner: rancher.io/local-path
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fast-data
  namespace: dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 128Mi
  storageClassName: demo-fast
---
apiVersion: v1
kind: Pod
metadata:
  name: demo-storageclass
  namespace: dev
spec:
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          df -h /data
          dd if=/dev/urandom of=/data/test.bin bs=1M count=10
          ls -lh /data/
          sleep 3600
      volumeMounts:
        - name: fast
          mountPath: /data
      resources:
        requests: {cpu: "5m", memory: "8Mi"}
        limits: {cpu: "200m", memory: "64Mi"}
  volumes:
    - name: fast
      persistentVolumeClaim:
        claimName: fast-data
# Vérifier le binding WaitForFirstConsumer :
#   kubectl get pvc fast-data -n dev        # Pending jusqu'au pod
#   kubectl apply -f (ce fichier)
#   kubectl get pvc fast-data -n dev        # Bound après création du pod
#   kubectl get pv
