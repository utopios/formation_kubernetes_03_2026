apiVersion: v1
kind: Pod
metadata:
  name: demo-pvc-reader
  namespace: dev
spec:
  containers:
    - name: reader
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "=== Contenu du volume persistant ==="
          cat /data/fichier.txt
          echo "=== Les données ont survécu au pod précédent ! ==="
          sleep 3600
      volumeMounts:
        - name: persistent
          mountPath: /data
      resources:
        requests: {cpu: "5m", memory: "8Mi"}
        limits: {cpu: "50m", memory: "32Mi"}
  volumes:
    - name: persistent
      persistentVolumeClaim:
        claimName: app-data
# Vérifier :
#   kubectl logs demo-pvc-reader -n dev
