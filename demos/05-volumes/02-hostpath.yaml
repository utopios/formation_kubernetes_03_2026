apiVersion: v1
kind: Pod
metadata:
  name: demo-hostpath
  namespace: dev
spec:
  nodeSelector:
    env: dev
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "$(date) — pod démarré sur $(hostname)" >> /host-logs/demo.log
          cat /host-logs/demo.log
          sleep 3600
      volumeMounts:
        - name: node-logs
          mountPath: /host-logs
      resources:
        requests: {cpu: "5m", memory: "8Mi"}
        limits: {cpu: "50m", memory: "32Mi"}
  volumes:
    - name: node-logs
      hostPath:
        path: /tmp/k8s-demo-logs
        type: DirectoryOrCreate
# Vérifier que les données persistent sur le nœud :
#   kubectl exec demo-hostpath -n dev -- cat /host-logs/demo.log
#   docker exec formation-k8s-worker cat /tmp/k8s-demo-logs/demo.log
