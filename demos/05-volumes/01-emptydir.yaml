apiVersion: v1
kind: Pod
metadata:
  name: demo-emptydir
  namespace: dev
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          while true; do
            echo "$(date) — écrit par writer" >> /shared/log.txt
            sleep 3
          done
      volumeMounts:
        - name: shared
          mountPath: /shared
      resources:
        requests: {cpu: "5m", memory: "8Mi"}
        limits: {cpu: "50m", memory: "32Mi"}
    - name: reader
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          sleep 2
          tail -f /shared/log.txt
      volumeMounts:
        - name: shared
          mountPath: /shared
      resources:
        requests: {cpu: "5m", memory: "8Mi"}
        limits: {cpu: "50m", memory: "32Mi"}
  volumes:
    - name: shared
      emptyDir:
        medium: ""
        sizeLimit: 50Mi
# Tester :
#   kubectl logs demo-emptydir -n dev -c writer
#   kubectl logs demo-emptydir -n dev -c reader -f
#   kubectl exec demo-emptydir -n dev -c writer -- ls /shared
