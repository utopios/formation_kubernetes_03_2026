apiVersion: apps/v1
kind: Deployment
metadata:
  name: result-ui
  namespace: {{ .Values.namespace }}
  labels:
    app: result-ui
    {{- include "vote-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.resultUi.replicaCount }}
  selector:
    matchLabels:
      app: result-ui
  template:
    metadata:
      labels:
        app: result-ui
    spec:
      containers:
        - name: result-ui
          image: {{ .Values.resultUi.image }}
          ports:
            - containerPort: {{ .Values.resultUi.port }}
          env:
            - name: RESULT_API_URL
              value: {{ .Values.resultUi.resultApiUrl | quote }}
          resources:
            {{- toYaml .Values.resultUi.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: result-ui
  namespace: {{ .Values.namespace }}
  labels:
    app: result-ui
    {{- include "vote-app.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    app: result-ui
  ports:
    - port: {{ .Values.resultUi.port }}
      targetPort: {{ .Values.resultUi.port }}
      nodePort: {{ .Values.resultUi.nodePort }}
