apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
  namespace: {{ .Values.namespace }}
  labels:
    app: vote
    {{- include "vote-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.vote.replicaCount }}
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
        - name: vote
          image: {{ .Values.vote.image }}
          ports:
            - containerPort: {{ .Values.vote.port }}
          envFrom:
            - configMapRef:
                name: voting-config
            - secretRef:
                name: voting-secrets
          resources:
            {{- toYaml .Values.vote.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: vote
  namespace: {{ .Values.namespace }}
  labels:
    app: vote
    {{- include "vote-app.labels" . | nindent 4 }}
spec:
  selector:
    app: vote
  ports:
    - port: {{ .Values.vote.port }}
      targetPort: {{ .Values.vote.port }}
