apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vote
  namespace: voting
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vote

  minReplicas: 2
  maxReplicas: 8

  metrics:
    # Métrique 1 : CPU (nécessite resources.requests.cpu sur le Deployment)
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60

    # Métrique 2 : Mémoire
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

  # Comportement de scale-down conservateur (évite l'instabilité en prod)
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # Attendre 5 min avant de réduire
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60             # Maximum -1 pod par minute
    scaleUp:
      stabilizationWindowSeconds: 0    # Réaction immédiate à la hausse
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60            # Maximum +2 pods par minute
