apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vote-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: vote-app
spec:
  project: default

  source:
    repoURL: https://github.com/utopios/vote-app.git
    targetRevision: HEAD
    # Chemin racine du repo — recurse: true parcourt tous les sous-dossiers
    path: .
    directory:
      recurse: true
      # Exclure les dossiers non-applicatifs si besoin
      # exclude: "{12-daemonset,13-jobs}/**"

  destination:
    server: https://kubernetes.default.svc
    namespace: voting

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      # ServerSideApply évite les erreurs "annotation too long" sur de gros objets
      - ServerSideApply=true
      # Ne re-sync que les ressources OutOfSync (optimisation)
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

  # Ignorer les replicas gérés par HPA
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas


