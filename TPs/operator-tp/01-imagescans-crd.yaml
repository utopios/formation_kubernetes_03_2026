apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: imagescans.security.formation.local
spec:
  group: security.formation.local
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["image"]
              properties:
                image:
                  type: string
                  description: "Image Docker à scanner (ex: nginx:1.25)"
                severity:
                  type: string
                  enum: ["UNKNOWN", "LOW", "MEDIUM", "HIGH", "CRITICAL"]
                  default: "HIGH"
                  description: "Niveau de sévérité minimum à reporter (UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL)"
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Pending", "Scanning", "Completed", "Failed"]
                startTime:
                  type: string
                  format: date-time
                completionTime:
                  type: string
                  format: date-time
                vulnerabilities:
                  type: object
                  properties:
                    critical:
                      type: integer
                    high:
                      type: integer
                    medium:
                      type: integer
                    low:
                      type: integer
                    total:
                      type: integer
                summary:
                  type: string
                jobName:
                  type: string
      additionalPrinterColumns:
        - name: Image
          type: string
          jsonPath: .spec.image
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Critical
          type: integer
          jsonPath: .status.vulnerabilities.critical
        - name: High
          type: integer
          jsonPath: .status.vulnerabilities.high
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
  scope: Namespaced
  names:
    plural: imagescans
    singular: imagescan
    kind: ImageScan
    shortNames:
      - is
